name: Tests

on:
  push:
    branches: [main]
  # every pull request, whatever its base, so stacked PRs are tested too
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
      # The base install, with the dev and test groups and no extra.
      - name: Install the package and the tests
        run: uv sync --locked
      - name: Run tests with coverage
        run: uv run --no-sync pytest -v
      - name: Upload coverage report
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage.xml
      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

  test-gridax-extra:
    name: with the gridax extra
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - name: Install the package, the tests and the extra
        run: uv sync --locked --extra gridax
      - name: Run the tests
        run: uv run --no-sync pytest -v --no-cov
