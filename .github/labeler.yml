# PR auto-labeling rules.
#
# Applied by .github/workflows/label-pr.yml using actions/labeler.
# Labels referenced here must exist — run `uv run poe gh-labels` to create them.
# The `dependencies` label is also created by the bootstrap script so this
# file works on a fresh repo with no manual label setup.
#
# Scopes below map file paths to the standard taxonomy:
#   area:*   — which part of the project the change touches
#   type:*   — left to issue templates (NOT auto-applied on PRs)

"area:engineering":
  - changed-files:
    - any-glob-to-any-file:
      - ".github/**"
      - "pyproject.toml"
      - ".pre-commit-config.yaml"
      - "uv.lock"

"area:docs":
  - changed-files:
    - any-glob-to-any-file:
      - "docs/**"
      - "mkdocs.yml"
      - "*.md"

"area:testing":
  - changed-files:
    - any-glob-to-any-file: "tests/**"

# One area per public module; the private code lives in src/tracerax/_src/<module>/.
"area:particles":
  - changed-files:
    - any-glob-to-any-file:
      - "src/tracerax/particles.py"
      - "src/tracerax/_src/particles/**"

"area:velocity":
  - changed-files:
    - any-glob-to-any-file:
      - "src/tracerax/velocity.py"
      - "src/tracerax/_src/velocity/**"

"area:advect":
  - changed-files:
    - any-glob-to-any-file:
      - "src/tracerax/advect.py"
      - "src/tracerax/_src/advect/**"

"area:bin":
  - changed-files:
    - any-glob-to-any-file:
      - "src/tracerax/bin.py"
      - "src/tracerax/_src/bin/**"

"area:analysis":
  - changed-files:
    - any-glob-to-any-file:
      - "src/tracerax/analysis.py"
      - "src/tracerax/_src/analysis/**"

# --- Default / legacy labels retained for Dependabot compatibility ---------

"dependencies":
  - changed-files:
    - any-glob-to-any-file:
      - "pyproject.toml"
      - ".pre-commit-config.yaml"
      - "uv.lock"
